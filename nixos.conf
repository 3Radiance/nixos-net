# /etc/nixos/configuration.nix
{ config, pkgs, ... }:

{
  imports = [
    ./hardware-configuration.nix
  ];

  # =========================================================================
  # BOOT & SYSTEM CORE
  # =========================================================================

  boot.loader.systemd-boot.enable = true;
  boot.loader.efi.canTouchEfiVariables = true;
  boot.kernelParams = [ "nvidia-drm.modeset=1" ];

  networking.hostName = "nixos";
  networking.networkmanager.enable = true;

  # Фиксируем системные DNS на локальный резолвер
  networking.networkmanager.dns = "none";
  networking.nameservers = [ "127.0.0.1" ];

  time.timeZone = "IDK";

  i18n.defaultLocale = "en_US.UTF-8";
  i18n.extraLocaleSettings = {
    LC_ADDRESS = "ru_RU.UTF-8";
    LC_IDENTIFICATION = "ru_RU.UTF-8";
    LC_MEASUREMENT = "ru_RU.UTF-8";
    LC_MONETARY = "ru_RU.UTF-8";
    LC_NAME = "ru_RU.UTF-8";
    LC_NUMERIC = "ru_RU.UTF-8";
    LC_PAPER = "ru_RU.UTF-8";
    LC_TELEPHONE = "ru_RU.UTF-8";
    LC_TIME = "ru_RU.UTF-8";
  };

  # =========================================================================
  # USER & SECURITY
  # =========================================================================

  users.users."your-user" = {
    isNormalUser = true;
    description = "user";
    extraGroups = [ 
      "networkmanager" 
      "wheel" 
      "wireshark" 
      "adbusers" 
      "plugdev" 
    ];
  };

  security.polkit.enable = true;
  security.rtkit.enable = true;

  # Gnome Keyring & PAM integration
  services.gnome.gnome-keyring.enable = true;
  security.pam.services.radiance-root.enableGnomeKeyring = true;

  # =========================================================================
  # DESKTOP ENVIRONMENT (Hyprland & Wayland)
  # =========================================================================

  programs.hyprland = {
    enable = true;
    xwayland.enable = true;
  };

  services.xserver.enable = false;
  services.xserver.displayManager.gdm.enable = false;

  # Переменные окружения для Wayland + Electron + Nvidia
  environment.sessionVariables = {
    NIXOS_OZONE_WL = "1";
    LIBVA_DRIVER_NAME = "nvidia";
    GBM_BACKEND = "nvidia-drm";
    __GLX_VENDOR_LIBRARY_NAME = "nvidia";
    WLR_NO_HARDWARE_CURSORS = "1";
    HYPRCURSOR_ENABLED = "0";
    XDG_CURRENT_DESKTOP = "Hyprland";
    XDG_SESSION_TYPE = "wayland";
    XDG_SESSION_DESKTOP = "Hyprland";
    QT_QPA_PLATFORM = "wayland;xcb";
  };

  # XDG Portals (скринкасты, фокус, скриншоты)
  xdg.portal = {
    enable = true;
    extraPortals = [ pkgs.xdg-desktop-portal-hyprland ];
  };

  # =========================================================================
  # HARDWARE & GRAPHICS (NVIDIA)
  # =========================================================================

  hardware.graphics.enable = true;
  services.xserver.videoDrivers = [ "nvidia" ];

  hardware.nvidia = {
    modesetting.enable = true;
    powerManagement.enable = false;
    powerManagement.finegrained = false;
    open = false; # Закрытые блобы NVIDIA для лучшей производительности
    nvidiaSettings = true;
  };

  # =========================================================================
  # AUDIO & PRINTING
  # =========================================================================

  services.printing.enable = true;
  services.pulseaudio.enable = false;
  
  services.pipewire = {
    enable = true;
    alsa.enable = true;
    alsa.support32Bit = true;
    pulse.enable = true;
  };

  # =========================================================================
  # SYSTEM PACKAGES & NIX-LD
  # =========================================================================

  nixpkgs.config.allowUnfree = true;

  # Шрифты для Waybar, Rofi и красивого терминала
  fonts.packages = with pkgs; [
    nerd-fonts.jetbrains-mono
    nerd-fonts.symbols-only
    font-awesome
  ];

  # Совместимость с не-NixOS бинарниками (FHS / Rust / Dynamic Linker)
  programs.nix-ld.enable = true;
  programs.nix-ld.libraries = with pkgs; [
    stdenv.cc.cc.lib
    openssl
    zlib
    libGL
    libx11
    libxrandr
    libxcursor
    libxinerama
    libxi
    libxxf86vm
    icu
    fontconfig
    freetype
    expat
    glib
    gtk3
    pango
    cairo
    atk
    gdk-pixbuf
    libpng
    libjpeg
    libtiff
    libwebp
    lcms2
    libxkbcommon
    mesa
    # Xorg библиотеки
    xorg.libXrender
    xorg.libXext
    xorg.libXdamage
    xorg.libXfixes
    xorg.libXcomposite
    xorg.libXcursor
    xorg.libXi
    xorg.libXinerama
    xorg.libXrandr
    xorg.libXxf86vm
    xorg.libICE
    xorg.libSM
  ];

  programs.firefox.enable = true;
  programs.wireshark = {
    enable = true;
    package = pkgs.wireshark;
  };

  # Системный софт
  environment.systemPackages = with pkgs; [
    # Утилиты
    git
    curl
    wget
    (btop.override { cudaSupport = true; })
    htop
    iptables
    iproute2
    unzip
    traceroute
    termius
    wstunnel
    code-cursor
    android-tools
    scrcpy
    usbutils
    yazi

    # Rust тулчейн
    rustc
    cargo
    rustfmt
    clippy

    # Hyprland обвязка
    waybar
    rofi
    dunst
    swww
    kitty
    grim
    slurp
    swappy
    wl-clipboard
    pavucontrol
  ];

  # Flatpak & Flathub(Telegram)
  services.flatpak.enable = true;
  systemd.services.flatpak-repo = {
    wantedBy = [ "multi-user.target" ];
    path = [ pkgs.flatpak ];
    script = ''
      flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    '';
  };

  # =========================================================================
  # DAEMONS & CUSTOM SERVICES
  # =========================================================================

  # 1. Zapret (Обход DPI)
  services.zapret = {
    enable = true;
    qnum = 300;
    params = [
      "--hostlist=/etc/zapret/hosts.txt"
      "--dpi-desync=fake,multisplit"
      "--dpi-desync-split-pos=1"
      "--dpi-desync-split-seqovl=681"
      "--dpi-desync-fooling=ts"
      "--dpi-desync-repeats=2"
      "--dpi-desync-fake-tls-mod=rnd,dupsid,sni=cloudflare.com"
      "--bind-fix4"
      "--bind-fix6"
    ];
  };

  # 2. Локальный Rust DoH-резолвер
  systemd.services.doh-stub = {
    description = "Custom Rust DoH Resolver";
    after = [ "network.target" ];
    wantedBy = [ "multi-user.target" ];
    serviceConfig = {
      ExecStart = "your/home/doh-stub-rust -p 53 -d https://1.1.1.1/dns-query";
      Restart = "always";
      RestartSec = "3s";
      User = "root";
    };
  };

  # 3. WSTunnel (SSH через WebSocket)
  systemd.services.wstunnel-ssh = {
    description = "wstunnel SSH tunnel service";
    after = [ "network-online.target" ];
    wants = [ "network-online.target" ];
    wantedBy = [ "multi-user.target" ];

    environment = {
      HTTP_PROXY = "http://127.0.0.1:10808";
    };

    serviceConfig = {
      ExecStart = "${pkgs.wstunnel}/bin/wstunnel client --http-upgrade-path-prefix your/path -L tcp://127.0.0.1:2222:127.0.0.1:23523 wss://YOUR_DOMAIN.com";
      Restart = "always";
      RestartSec = "5s";
      User = "radiance-root";
    };
  };

  # =========================================================================
  # STATE VERSION
  # =========================================================================

  system.stateVersion = "26.05";
}
